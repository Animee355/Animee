name: Deploy Animee AI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/animee-ai-chat/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-animee-ai.yml"

permissions:
  contents: read

concurrency:
  group: deploy-animee-ai
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Animee AI Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing GitHub Actions secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy animee-ai-chat --project-ref mnfzpbwhvierboadwctz
